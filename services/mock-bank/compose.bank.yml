services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: futureledger_bank
      POSTGRES_USER: futureledger
      POSTGRES_PASSWORD: futureledger
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futureledger -d futureledger_bank"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - futureledger-bank-postgres-18:/var/lib/postgresql

volumes:
  futureledger-bank-postgres-18:

